<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0B0710" />
  <title>KeyVEX — Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #0b0710;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 420px;
      padding: 28px 24px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { margin: 0 0 18px; color: rgba(255, 255, 255, 0.85); line-height: 1.5; font-size: 15px; }
    a {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ff9a4a, #ff4a2c);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>You’re currently offline</h1>
    <p>Your locally cached encrypted vault remains safe on this device. Reconnect or open the app shell to access your saved passwords.</p>
    <a href="/">Open KeyVEX</a>
  </main>
</body>
</html>
