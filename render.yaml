services:
  - type: web
    name: keyvex
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: TRUST_PROXY
        value: 1
      - key: DATABASE_PATH
        value: /data/keyvex.db
      - key: MULTI_INSTANCE
        value: false
    disk:
      name: keyvex-sqlite-data
      mountPath: /data
      sizeGB: 1
